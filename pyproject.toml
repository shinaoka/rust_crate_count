[project]
name = "rust-crate-count"
version = "0.1.0"
description = "Count crates.io crates over time from the official database dump and generate CSV and charts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9",
]

[project.scripts]
rust-crate-count = "rust_crate_count.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rust_crate_count"]
